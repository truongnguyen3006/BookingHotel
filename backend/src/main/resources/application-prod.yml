spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

security:
  jwt:
    secret-base64: ${JWT_SECRET_B64}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
