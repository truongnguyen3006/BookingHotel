spring:
  application:
    name: booking-hotel-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_hotel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:booking_app}
    password: ${DB_PASSWORD:booking_app_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.bookinghotel.backend: INFO

security:
  jwt:
    # Development fallback only. Override JWT_SECRET_B64 outside local development.
    secret-base64: ${JWT_SECRET_B64:Ym9va2luZy1ob3RlbC1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVz}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
