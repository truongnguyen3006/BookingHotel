spring:
  application:
    name: booking-hotel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.bookinghotel.backend: INFO

security:
  jwt:
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}

app:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:Hotel Admin}

vnpay:
  tmn-code: ${VNP_TMN_CODE:}
  hash-secret: ${VNP_HASH_SECRET:}
  pay-url: ${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNP_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
  expire-minutes: ${VNP_EXPIRE_MINUTES:15}
  confirmation-grace-seconds: ${VNP_CONFIRMATION_GRACE_SECONDS:120}

booking:
  reservation-minutes: ${BOOKING_RESERVATION_MINUTES:15}
  expiration-scan-ms: ${BOOKING_EXPIRATION_SCAN_MS:60000}
