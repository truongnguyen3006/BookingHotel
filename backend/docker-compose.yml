services:
  mysql:
    image: mysql:8.4
    container_name: booking-hotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: booking_hotel
      MYSQL_USER: booking_app
      MYSQL_PASSWORD: booking_app_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - booking_hotel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  booking_hotel_mysql_data:
